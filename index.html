<!DOCTYPE html>
<html>
<head>
    <title>My Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>Priya Sharma</h1>
        <nav>
            <a href="#about">About</a>
            <a href="#skills">Skills</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main>
        <section id="about" class="section">
            <h2>About Me</h2>
            <p>I am <strong>passionate</strong> about web development and <em>love</em> learning new things.</p>
        </section>

        <section class="section">
            <h2>User Info (from API)</h2>
            <div id="userCard"></div>
        </section>

        <section id="skills" class="section">
            <h2>My Skills</h2>
            <div class="skills-container" id="skillsContainer">
            </div>
        </section>

        <section id="contact" class="section">
            <h2>Contact Me</h2>
            <form>
                <label>Name:</label>
                <input type="text" id="nameField">
                <br><br>
                <label>Email:</label>
                <input type="email">
                <br><br>
                <label>Message:</label>
                <br>
                <textarea rows="4" cols="30"></textarea>
                <br><br>
                <button id="submitBtn">Submit</button>
            </form>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Priya Sharma's Portfolio</p>
    </footer>

    <script src="game.js"></script>
</body>
</html>
